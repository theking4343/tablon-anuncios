{% extends "base.html" %}
{% block title %}Usuarios{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Usuarios</h2>
  <a href="{{ url_for('usuarios.nuevo') }}" class="btn btn-primary">Nuevo usuario</a>
</div>

<table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Correo</th>
      <th class="text-end">Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for u in usuarios %}
    <tr>
      <td>{{ u.id }}</td>
      <td>{{ u.nombre }}</td>
      <td>{{ u.email }}</td>
      <td class="text-end">
        <a href="{{ url_for('usuarios.editar', id=u.id) }}" class="btn btn-sm btn-warning">Editar</a>
        <form method="post" action="{{ url_for('usuarios.eliminar', id=u.id) }}"
              class="d-inline" onsubmit="return confirm('¿Eliminar este usuario y todos sus anuncios?');">
          <button class="btn btn-sm btn-danger">Eliminar</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center text-muted">No hay usuarios registrados.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
