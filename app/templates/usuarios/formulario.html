{% extends "base.html" %}
{% block title %}{{ 'Editar' if usuario else 'Nuevo' }} usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-3">{{ 'Editar' if usuario else 'Nuevo' }} usuario</h2>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" maxlength="100"
               value="{{ usuario.nombre if usuario else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" name="email" class="form-control" maxlength="120"
               value="{{ usuario.email if usuario else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control"
               {% if not usuario %}required{% endif %}>
        {% if usuario %}
        <div class="form-text">Déjala en blanco para mantener la contraseña actual.</div>
        {% endif %}
      </div>
      <button class="btn btn-success">Guardar</button>
      <a href="{{ url_for('usuarios.lista') }}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
