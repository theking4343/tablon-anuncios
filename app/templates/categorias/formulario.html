{% extends "base.html" %}
{% block title %}{{ 'Editar' if categoria else 'Nueva' }} categoría{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-3">{{ 'Editar' if categoria else 'Nueva' }} categoría</h2>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" maxlength="80"
               value="{{ categoria.nombre if categoria else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion" class="form-control" rows="3" maxlength="255">{{ categoria.descripcion if categoria and categoria.descripcion else '' }}</textarea>
      </div>
      <button class="btn btn-success">Guardar</button>
      <a href="{{ url_for('categorias.lista') }}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
