{% extends "base.html" %}
{% block title %}Categorías{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Categorías</h2>
  <a href="{{ url_for('categorias.nueva') }}" class="btn btn-primary">Nueva categoría</a>
</div>

<table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Descripción</th>
      <th class="text-end">Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for c in categorias %}
    <tr>
      <td>{{ c.id }}</td>
      <td>{{ c.nombre }}</td>
      <td>{{ c.descripcion }}</td>
      <td class="text-end">
        <a href="{{ url_for('categorias.editar', id=c.id) }}" class="btn btn-sm btn-warning">Editar</a>
        <form method="post" action="{{ url_for('categorias.eliminar', id=c.id) }}"
              class="d-inline" onsubmit="return confirm('¿Eliminar esta categoría?');">
          <button class="btn btn-sm btn-danger">Eliminar</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center text-muted">No hay categorías registradas.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
